<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital business card — CompanyCard</title>
<link rel="canonical" href="https://company-card.com/app/card.html">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="description" content="A CompanyCard digital business card. Tap to save the contact — no app needed.">
<!-- A card is shared as a link far more often than it is visited from search,
     so this page's preview is the product's first impression. It had none:
     WhatsApp, Slack and iMessage rendered a bare URL. These are deliberately
     static — the card itself is rendered client-side, and link crawlers do not
     run JavaScript, so per-person titles would need prerendering (see notes). -->
<meta property="og:title" content="Digital business card — CompanyCard">
<meta property="og:description" content="Someone shared their CompanyCard with you. Tap to see their details and save the contact — no app needed.">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="CompanyCard">
<meta property="og:image" content="https://company-card.com/assets/png/favicon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Digital business card — CompanyCard">
<meta name="twitter:description" content="Someone shared their CompanyCard with you. Tap to see their details and save the contact — no app needed.">
<meta name="twitter:image" content="https://company-card.com/assets/png/favicon-512.png">
<link rel="icon" href="../assets/logo-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="viewer">
  <div class="wrap">
    <div id="view"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="product.js"></script>
<script src="card-view.js"></script>
  <script>
  (function () {
    var view = document.getElementById("view");
    var card = null;
    var h = location.hash || "";
    var m = h.match(/c=([^&]+)/);
    if (m) card = CC.decode(m[1]);
    if (!card) { var id = new URLSearchParams(location.search).get("id"); if (id) card = CC.get(id); }
    if (!card || !card.name) { CCView.empty(view); return; }
    document.title = card.name + " — CompanyCard";
    /* Everything around the card (QR panel, credit link, Save handler, GA4) is
       CCView — shared with c.html so the two public pages cannot drift. */
    CCView.show(view, card, { qrUrl: location.href, qrFallback: CC.shareUrl(card, true), source: "shared_card", pageLocation: "/app/card" });
  })();
  </script>
<script src="../assets/analytics.js"></script>
</body>
</html>
